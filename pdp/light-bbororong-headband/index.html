<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=6,user-scalable=yes"><meta name="robots" content="noindex,nofollow"><title>불빛 뾰로롱 머리띠 미리보기</title><style>*{box-sizing:border-box}body{margin:0;font:14px -apple-system,"Malgun Gothic",sans-serif;background:#fff}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #eee;padding:10px 14px;display:flex;gap:8px;align-items:center}.top b{font-size:16px}.badge{font-size:11px;background:#fff4e5;color:#b45309;border-radius:6px;padding:2px 6px}.sw{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.sw::-webkit-scrollbar{display:none}.it{position:relative;flex:0 0 100%;scroll-snap-align:center}.it img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.it span{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;border-radius:10px;padding:2px 9px}.cnt{position:relative}.cnt i{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-style:normal;font-size:12px;border-radius:12px;padding:2px 9px}.sep{height:10px;background:#f4f4f4}.dt h3{margin:0;padding:14px 16px;font-size:15px;border-bottom:1px solid #eee}.dt img{display:block;width:100%}.note{font-size:12px;color:#999;text-align:center;padding:20px}</style></head><body><div class="top"><b>불빛 뾰로롱 머리띠</b><span class="badge">시안 미리보기</span></div><div class="cnt"><div class="sw" id="sw"><div class="it"><img src="t01_n1.jpg"><span>네이버</span></div><div class="it"><img src="t01_n2.jpg"><span>네이버</span></div><div class="it"><img src="t01_n3.jpg"><span>네이버</span></div><div class="it"><img src="t01_n4.jpg"><span>네이버</span></div><div class="it"><img src="t01_n5.jpg"><span>네이버</span></div><div class="it"><img src="t01_n6.jpg"><span>네이버</span></div><div class="it"><img src="t01_n7.jpg"><span>네이버</span></div><div class="it"><img src="t01_n8.jpg"><span>네이버</span></div><div class="it"><img src="t02_c1.jpg"><span>쿠팡</span></div><div class="it"><img src="t02_c2.jpg"><span>쿠팡</span></div></div><i id="ct"></i></div><div class="sep"></div><div class="dt"><h3>상세정보</h3><img src="d1.jpg" loading="lazy"><img src="d2.jpg" loading="lazy"><img src="d3.jpg" loading="lazy"><img src="d4.jpg" loading="lazy"><img src="d5.jpg" loading="lazy"><img src="d6.jpg" loading="lazy"><img src="d7.jpg" loading="lazy"><img src="d8.jpg" loading="lazy"><img src="d9.jpg" loading="lazy"><img src="d10.jpg" loading="lazy"><img src="d11.jpg" loading="lazy"></div><div class="note">두 손가락으로 확대해서 볼 수 있어요. 실제 판매 페이지가 아닌 컨펌용 시안입니다.</div><script>const sw=document.getElementById('sw');function u(){document.getElementById('ct').textContent=(Math.round(sw.scrollLeft/sw.clientWidth)+1)+' / '+sw.children.length}sw.addEventListener('scroll',u);u();</script></body></html>
