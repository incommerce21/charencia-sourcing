<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=6,user-scalable=yes"><meta name="robots" content="noindex,nofollow"><title>통통 루돌프 도자기 오브제 미리보기</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,"Malgun Gothic",sans-serif;background:#fff;color:#111}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #eee;padding:10px 14px;font-weight:700}
.sw{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.sw::-webkit-scrollbar{display:none}
.sw img{flex:0 0 100%;width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:center}
.cnt{position:relative}.cnt span{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;border-radius:12px;padding:2px 9px}
.sep{height:10px;background:#f4f4f4}.lb{padding:12px 16px;font-weight:700;font-size:14px}
.dt img{display:block;width:100%}.note{font-size:12px;color:#999;text-align:center;padding:20px}</style></head><body>
<div class="top">통통 루돌프 도자기 오브제 (컨펌용 시안)</div>
<div class="lb">썸네일 10장 (옆으로 넘겨 보세요)</div>
<div class="cnt"><div class="sw" id="sw"><img src="t01.jpg"><img src="t02.jpg"><img src="t03.jpg"><img src="t04.jpg"><img src="t05.jpg"><img src="t06.jpg"><img src="t07.jpg"><img src="t08.jpg"><img src="t09.jpg"><img src="t10.jpg"></div><span id="ct">1 / 10</span></div><div class="sep"></div>
<div class="lb">상세페이지 9개 섹션</div><div class="dt"><img src="d01.jpg" loading="lazy"><img src="d02.jpg" loading="lazy"><img src="d03.jpg" loading="lazy"><img src="d04.jpg" loading="lazy"><img src="d05.jpg" loading="lazy"><img src="d06.jpg" loading="lazy"><img src="d07.jpg" loading="lazy"><img src="d08.jpg" loading="lazy"><img src="d09.jpg" loading="lazy"></div>
<div class="note">두 손가락으로 확대해서 볼 수 있어요. 실제 판매 페이지가 아닌 컨펌용 시안입니다.</div>
<script>const sw=document.getElementById('sw');sw.addEventListener('scroll',()=>{document.getElementById('ct').textContent=(Math.round(sw.scrollLeft/sw.clientWidth)+1)+' / 10'})</script></body></html>
