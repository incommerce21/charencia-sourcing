<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=6,user-scalable=yes"><meta name="robots" content="noindex,nofollow"><title>털 복실 머리띠 3종 미리보기</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;color:#111}
.top{padding:12px 16px;font-weight:700;border-bottom:1px solid #eee}
.cnt{position:relative}.sw{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}.sw::-webkit-scrollbar{display:none}
.sw figure{flex:0 0 100%;margin:0;scroll-snap-align:center;position:relative}.sw img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.sw figcaption{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;border-radius:10px;padding:2px 8px}
#ct{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;border-radius:12px;padding:2px 9px}
.dt img{display:block;width:100%}.sep{height:10px;background:#f4f4f4}</style></head><body>
<div class="top">털 복실 머리띠 3종</div>
<div class="cnt"><div class="sw" id="sw"><figure><img src="n1.jpg"><figcaption>네이버 1</figcaption></figure><figure><img src="n2.jpg"><figcaption>네이버 2</figcaption></figure><figure><img src="n3.jpg"><figcaption>네이버 3</figcaption></figure><figure><img src="n4.jpg"><figcaption>네이버 4</figcaption></figure><figure><img src="n5.jpg"><figcaption>네이버 5</figcaption></figure><figure><img src="n6.jpg"><figcaption>네이버 6</figcaption></figure><figure><img src="c1.jpg"><figcaption>쿠팡 1</figcaption></figure><figure><img src="c2.jpg"><figcaption>쿠팡 2</figcaption></figure><figure><img src="c3.jpg"><figcaption>쿠팡 3</figcaption></figure><figure><img src="c4.jpg"><figcaption>쿠팡 4</figcaption></figure><figure><img src="r1.jpg"><figcaption>로켓 3개입</figcaption></figure></div><span id="ct"></span></div>
<div class="sep"></div><div class="dt"><img src="d1.jpg" loading="lazy"><img src="d2.jpg" loading="lazy"><img src="d3.jpg" loading="lazy"><img src="d4.jpg" loading="lazy"><img src="d5.jpg" loading="lazy"><img src="d6.jpg" loading="lazy"><img src="d7.jpg" loading="lazy"><img src="d8.jpg" loading="lazy"></div>
<script>const sw=document.getElementById('sw');const u=()=>{document.getElementById('ct').textContent=(Math.round(sw.scrollLeft/sw.clientWidth)+1)+' / '+sw.children.length};sw.addEventListener('scroll',u);u();</script></body></html>
